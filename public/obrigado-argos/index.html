<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Um agradecimento jogável a quem construiu o Argos.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caminhada do Argos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: em tela larga o palco 16:9 ocupa a página inteira e placa, seleção e botão ficam por cima dele; em tela estreita, palco em cima e placa embaixo. Mundo único (noite de tinta), sem tema claro. */
:root{
  color-scheme:dark;
  --ink:#141a36; --ink-2:#222c57; --paper:#efe6d0; --paper-ink:#1b2440;
  --chopp:#f0b429; --go:#2f9e57; --muted:#9aa6c4;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;box-sizing:border-box;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
header,#wrap{width:100%;max-width:980px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;color:var(--chopp);letter-spacing:.02em}
#snd{font-family:var(--display);font-size:.85rem;padding:4px 10px;border:2px solid var(--ink-2);border-radius:4px;background:transparent;color:var(--paper);cursor:pointer}
#snd[aria-pressed="false"]{color:var(--muted)}
#wrap{position:relative;display:flex;flex-direction:column;gap:8px}
canvas#stage{display:block;width:100%;aspect-ratio:16/9;max-width:100%;box-sizing:border-box;border:3px solid var(--ink-2);border-radius:4px;
  background:#000;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#panel{box-sizing:border-box;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:12px 14px;min-height:11.5rem;
  display:flex;flex-direction:column;gap:6px}
#eyebrow{font-family:var(--display);font-size:.8em;letter-spacing:.12em;text-transform:uppercase;margin:0;color:#6b5f45}
#ttl{font-family:var(--display);font-weight:600;font-size:1.3em;margin:0;text-wrap:balance;line-height:1.2}
#txt{margin:0;max-width:62ch}
#q{margin:0;font-weight:500;color:#7a2e1f}
#pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#pick button{background:#e2d6b8;border:2px solid #b9a97f;border-radius:4px;padding:6px 2px 4px;cursor:pointer;color:var(--paper-ink);
  font-family:var(--display);font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
#pick button:hover{background:#f7efda;border-color:var(--paper-ink)}
#pick canvas{width:48px;height:74px;image-rendering:pixelated}
#btn{font-family:var(--display);font-weight:600;font-size:1.25rem;padding:14px;border:0;border-radius:4px;
  background:var(--paper-ink);color:var(--paper);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline:2px solid var(--paper)}
#btn.go{background:var(--go);color:#fff}
#btn:active{filter:brightness(1.2)}
button:focus-visible{outline:3px solid var(--chopp);outline-offset:2px}
#hint{margin:0;font-size:.85rem;color:var(--muted)}
/* tela larga: tudo cabe na janela, sem rolagem */
@media (min-width:760px) and (min-aspect-ratio:5/4){
  header,#wrap{max-width:none;width:min(100%,calc((100dvh - 72px)*16/9))}
  #hint{display:none}
  /* placa na faixa de baixo, para o céu ficar livre para os outdoors */
  #panel{position:absolute;left:1.5%;bottom:2.5%;width:72%;min-height:0;padding:8px 12px;font-size:clamp(11px,1.12vw,15px);line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.35);
    flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
  #panel #ttl{order:-1;font-size:1.2em}
  #panel #txt,#panel #q,#panel #pick{flex-basis:100%;max-width:none}
  body[data-state="select"] #panel{top:50%;left:50%;bottom:auto;transform:translate(-50%,-50%);width:min(74%,640px);font-size:15px;padding:12px 14px;gap:6px 12px}
  #btn{position:absolute;right:1.5%;bottom:5%;padding:.6em 1.3em;font-size:clamp(14px,1.6vw,22px);box-shadow:0 3px 0 rgba(0,0,0,.4)}
}
</style>
</head>
<body data-pagefind-ignore="all">

<main>
  <header><h1>Caminhada do Argos</h1><button id="snd" type="button" aria-pressed="true">♪ Som ligado</button></header>
  <div id="wrap">
    <canvas id="stage" aria-label="Os oito personagens caminhando pelas etapas do projeto"></canvas>
    <section id="panel" aria-live="polite">
      <p id="eyebrow"></p>
      <h2 id="ttl"></h2>
      <p id="txt"></p>
      <p id="q" hidden></p>
      <div id="pick"></div>
    </section>
    <button id="btn" type="button" hidden></button>
  </div>
  <p id="hint">Para andar: segure o botão, a tela, a seta → ou a barra de espaço. Em cada cancela, quem decide é você.</p>
</main>

    const im=IM[ST[i].shot];if(im&&im.complete&&im.naturalWidth){const bh=Math.round(112*im.naturalHeight/im.naturalWidth);
      R(b+308,G-60,3,60,'#30364d');R(b+401,G-60,3,60,'#30364d');R(b+298,G-66-bh,116,bh+4,'#30364d');g.drawImage(im,b+300,G-64-bh,112,bh)}}
  for(const gt of gates){const gx=gt.x-cam;if(gx<-40||gx>W+40)continue; // cancela
    R(gx,G-24,4,24,'#30364d');g.save();g.translate(gx+2,G-20);g.rotate(gt.open*Math.PI/2);
    for(let k=0;k<6;k++)R(-28+k*4.7,-1.5,4.7,3,k%2?'#fff':'#d0392b');g.restore();
    R(gx-12,G-42,28,10,gt.go?'#2f9e57':'#1b2440');Tx(gt.go?'GO':'GO/NO-GO',gx+2,G-34.5,'#fff',gt.go?7:5)}
  { // chefão simbólico: o Artigão, parado na última cancela
    const gt=gates[BOSS],bx=gt.x-cam-22,bw=44;
    if(bx>-60&&bx<W+10){
      if(boss.dead>=1){R(bx+16,G-16,12,16,'#fbfaf5');R(bx+16,G-16,12,1,'#c9c2ad');Tx('v1',bx+22,G-6,'#1b2440',6)}
      else{const h=Math.round(58*(1-boss.dead)),X=bx+(boss.shake>0?Math.round(Math.sin(T*70)*2):0),top=G-h;
        R(X,top,bw,h,'#fbfaf5');R(X,top,bw,2,'#c9c2ad');R(X,top,2,h,'#c9c2ad');R(X+bw-2,top,2,h,'#c9c2ad');R(X+bw-9,top,9,9,'#d8d0b8');
        if(h>44){R(X-5,top+24,5,3,'#fbfaf5');R(X+bw,top+24,5,3,'#fbfaf5');R(X+6,top+5,22,3,'#1b2440');
          R(X+8,top+15,9,6,'#1b2440');R(X+27,top+15,9,6,'#1b2440');R(X+11,top+17,3,3,'#ff4d4d');R(X+30,top+17,3,3,'#ff4d4d');
          R(X+7,top+11,5,2,'#1b2440');R(X+11,top+12,6,2,'#1b2440');R(X+27,top+12,6,2,'#1b2440');R(X+32,top+11,5,2,'#1b2440');
          for(let j=0;j<6;j++)R(X+9+j*4.5,top+27+(j%2)*3,4,3,'#1b2440');for(let r=0;r<4;r++)R(X+6,top+39+r*4,32-(r%2)*9,2,'#9aa6c4')}
        R(X,top-9,bw,4,'#30364d');R(X,top-9,Math.round(bw*boss.hp/boss.max),4,'#d0392b');Tx('ARTIGÃO',X+bw/2,top-12,'#f0b429',6)}}
  }
  for(const d of drops){const dx=d.x-cam+Math.sin(T*2+d.ph)*(d.land?0:3);g.font='600 5px "Pixelify Sans",monospace';const w=g.measureText(d.s).width;
    g.globalAlpha=d.land?Math.max(0,1-d.land/2):1;R(dx-w/2-3,d.y-6,w+6,8,'#7a2e1f');R(dx-w/2-3,d.y-6,w+6,1,'#a84a35');Tx(d.s,dx,d.y,'#f4ead0',5);g.globalAlpha=1}
  const moving=state==='walk'&&hold;
  for(let i=order.length-1;i>=0;i--){const c=CAST[order[i]],cx=x-i*GAP-cam;
    drawChar(g,c,cx,G,moving?T*4+i*.37:-1,state==='bar'?Math.max(0,Math.sin(barT*3-i*.5))*Math.min(1,barT):null);
  }
  for(let i=order.length-1;i>=0;i--){const c=CAST[order[i]],cx=x-i*GAP-cam,row=i%3,ny=G-37-row*9,lead=i===0&&state!=='select'; // balões de nome
    g.font='600 5px "Pixelify Sans",monospace';const nw=Math.ceil(g.measureText(c.n).width)+6,nx=Math.round(cx+5-nw/2);
    if(row)R(cx+5,ny+2,1,row*9,'rgba(27,36,64,.45)');
    R(nx,ny-6,nw,9,'#1b2440');R(nx+1,ny-5,nw-2,7,lead?'#f0b429':'#efe6d0');R(cx+4,ny+3,2,1,'#1b2440');Tx(c.n,cx+5,ny,'#1b2440',5)}
  for(const s of shots){if(s.t<0)continue;const px=s.x0+(gates[BOSS].x-s.x0)*s.t-cam,py=G-14-21*s.t-Math.sin(s.t*3.14)*14;
    if(s.kind){R(px,py,6,1,'#d0392b');R(px+6,py,1,1,'#1b2440')}else{R(px,py,3,3,'#f0b429');R(px-3,py+1,3,1,'#fff3c4')}}
  if(fx){g.globalAlpha=Math.max(0,1-fx.t);Tx(fx.s,gates[BOSS].x-cam,G-78-fx.t*12,fx.c,9);g.globalAlpha=1}
  if(stamp){const a=1-stamp.t;g.globalAlpha=Math.max(0,a);Tx('GO!',stamp.x-cam,G-52-stamp.t*18,'#2f9e57',16);g.globalAlpha=1}
  // PRISMA no canto: funil que ganha um degrau por marco; a caixa é medida pelo texto, então nada estoura
  const pr=PRISMA.filter(r=>x>=r[0]*L);
  if(pr.length&&state!=='bar'){g.font='600 5px "Pixelify Sans",monospace';
    const tw=Math.max(...pr.map(r=>g.measureText(r[2]).width)),cx=33,bw=6+46+5+Math.ceil(tw)+7;
    g.globalAlpha=.9;R(4,4,bw,15+pr.length*9,'#141a36');g.globalAlpha=1;Tx('PRISMA',10,12,'#f0b429',6,'left');
    pr.forEach((r,i)=>{const w0=r[1],w1=PRISMA[i+1]?PRISMA[i+1][1]:r[1]*.6,y0=16+i*9;g.fillStyle=r[3]?'#2f9e57':i===pr.length-1?'#f0b429':'#56627a';
      g.beginPath();g.moveTo(cx-w0/2,y0);g.lineTo(cx+w0/2,y0);g.lineTo(cx+w1/2,y0+8);g.lineTo(cx-w1/2,y0+8);g.fill();
      Tx(r[2],61,y0+6,r[3]?'#7be0a0':'#efe6d0',5,'left')})}
  if(state==='bar')for(let i=0;i<36;i++)R((i*53+barT*14*(1+i%3))%W,(i*29+barT*34*(1+i%2))%G,2,2,['#f0b429','#ff5fa2','#6fdc8c','#fff'][i%4]);
}

// ---------- estado ----------
function panel(){
  const sel=state==='select',s=ST[Math.max(0,seg)];
  document.body.dataset.state=state;
  $('pick').hidden=!sel;btn.hidden=sel;$('q').hidden=state!=='gate';
  if(sel){$('eyebrow').textContent='Antes de começar';$('ttl').textContent='Quem é você?';$('txt').textContent='Escolha o seu personagem. Os outros sete vão junto, do começo ao fim.';return}
  $('eyebrow').textContent=(s.f?`Fase ${s.f} · ${FASES[s.f]} · `:'')+`Etapa ${seg+1} de ${ST.length}`;$('ttl').textContent=s.n;$('txt').textContent=s.t;
  if(state==='boss'){$('eyebrow').textContent='Chefão final';$('ttl').textContent='O Artigão';$('txt').textContent='Revisor 2, limite de palavras, mais uma versão. Sozinho ninguém derrota: alternem o poder das LLMs com o conhecimento de vocês.'}
  if(state==='gate')$('q').textContent='GO / NO-GO: '+s.q;
  btn.className=state==='gate'||(state==='boss'&&boss.n%2)?'go':'';
  btn.textContent=state==='gate'?'GO':state==='bar'?'Caminhar de novo':state==='boss'?(boss.hp<=0?'Derrotado!':boss.n%2?'Conhecimento dos especialistas':'Poder das LLMs'):'Segure para andar ▶';
}
function reset(){state='select';x=130;seg=-1;barT=0;stamp=null;drops=[];shots=[];fx=null;boss={hp:6,max:6,shake:0,dead:0,n:0};hold=false;order=CAST.map((_,i)=>i);
  gates=ST.slice(0,-1).map((_,i)=>({x:(i+1)*L-22,open:0,go:false}));panel()}
function pick(i){audio();order=[i,...CAST.map((_,k)=>k).filter(k=>k!==i)];state='walk';seg=0;panel();btn.focus({preventScroll:true})}
function go(){const gt=gates[seg];gt.go=true;stamp={x:gt.x,t:0};state='walk';hold=false;panel()}
// cada golpe alterna o poder das LLMs com o conhecimento dos especialistas; não dá para perder
function hit(){if(boss.hp<=0)return;const esp=boss.n%2;
  CAST.forEach((_,i)=>shots.push({x0:x-i*GAP+8,t:-i*.05,kind:esp}));
  fx={s:(esp?['corrige!','valida!','define!']:['lê tudo!','extrai!','resume!'])[(boss.n>>1)%3],t:0,c:esp?'#d0392b':'#f0b429'};
  boss.n++;boss.hp--;boss.shake=.45;if(boss.hp<=0)boss.dead=.01;panel()}
function update(dt){
  boss.shake=Math.max(0,boss.shake-dt);if(boss.dead&&boss.dead<1.4){boss.dead+=dt;if(boss.dead>=1.4&&state==='boss'){state='gate';panel()}}
  for(const s of shots)s.t+=dt*2.6;shots=shots.filter(s=>s.t<1);if(fx&&(fx.t+=dt)>1)fx=null;
  T+=dt;for(const gt of gates)if(gt.go)gt.open=Math.min(1,gt.open+dt*2.5);
  if(stamp&&(stamp.t+=dt)>1)stamp=null;
  if(state==='bar')barT+=dt;
  if(!CALM&&(state==='walk'||state==='gate')&&seg<ST.length-1&&(nextDrop-=dt)<0){nextDrop=.7+Math.random()*.9;const l=WOES[seg];
    drops.push({s:l[Math.floor(Math.random()*l.length)],x:Math.max(0,x-200)+30+Math.random()*260,y:-6,v:20+Math.random()*16,ph:Math.random()*6,land:0})}
  for(const d of drops){if(d.land)d.land+=dt;else if((d.y+=d.v*dt)>=G+9){d.y=G+9;d.land=.01}}
  drops=drops.filter(d=>d.land<2);
  if(state!=='walk'||!hold)return;
  x+=SPEED*dt;
  const gt=gates[seg];
  if(gt&&!gt.go&&x>=gt.x-42){x=gt.x-42;state=seg===BOSS&&boss.hp>0?'boss':'gate';hold=false;panel();return}
  if(x>=BARX){x=BARX;state='bar';hold=false;panel();return}
  const ns=Math.min(ST.length-1,Math.floor(x/L));if(ns!==seg){seg=ns;panel()}
}

// ---------- entrada ----------
const press=()=>{downState=state;if(state==='walk')hold=true};
btn.addEventListener('pointerdown',press);
cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('pointerup',()=>hold=false);addEventListener('pointercancel',()=>hold=false);addEventListener('blur',()=>hold=false);
btn.addEventListener('click',e=>{if(e.detail===0&&performance.now()-spaceAt<600)return;const s=e.detail===0?state:downState; // soltar o botão de andar em cima da cancela não conta como GO
  if(s==='gate'&&state==='gate')go();else if(s==='boss'&&state==='boss')hit();else if(s==='bar'&&state==='bar')reset()});
btn.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('contextmenu',e=>e.preventDefault());
// teclado: seta, D ou espaço seguram a caminhada; espaço ou Enter dão GO e golpeiam (sem repetição, para a tecla presa não atravessar a cancela)
let spaceAt=0;const WALK=['ArrowRight','KeyD','Space'];
addEventListener('keydown',e=>{if(state==='select')return;
  if(WALK.includes(e.code)){e.preventDefault();if(e.code==='Space')spaceAt=performance.now();if(state==='walk')hold=true}
  if((e.code==='Space'||(e.code==='Enter'&&document.activeElement!==btn))&&!e.repeat){if(state==='gate')go();else if(state==='boss')hit()}});
addEventListener('keyup',e=>{if(WALK.includes(e.code)){if(state!=='select')e.preventDefault();hold=false}});

// ---------- música: composição própria, rock de riff na caminhada e disco no bar ----------
let AC=null,master,NB,mus=true,mstep=0,nextT=0;
const F=n=>440*2**((n-69)/12);
// riff próprio: acordes secos com pausa, andamento de estrada (116 bpm)
const ROCK=[40,0,0,40,43,0,45,0, 0,45,0,43,0,0,40,0, 40,0,0,40,43,0,45,0, 48,0,50,0,45,0,0,0];
const DISCO=[45,41,48,43],ARP=[0,1,2,3,2,1,2,1];
function env(v,t,d){const e=AC.createGain();e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);e.connect(master);return e}
function tone(f,t,d,type,v){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.connect(env(v,t,d));o.start(t);o.stop(t+d)}
function noise(t,d,v,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=hp;s.connect(f).connect(env(v,t,d));s.start(t);s.stop(t+d)}
function kick(t){const o=AC.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);o.connect(env(.6,t,.15));o.start(t);o.stop(t+.16)}
function beat(i,t){
  if(state==='bar'){const r=DISCO[(i>>3)%4],s=i%8,ch=r===45?[0,3,7,12]:[0,4,7,12];
    tone(F(r-12+(s%2?12:0)),t,.2,'triangle',.3);tone(F(r+24+ch[ARP[s]]),t,.18,'square',.045);
    if(s%2===0)kick(t);else noise(t,.08,.07,6000);if(s%4===2)noise(t,.1,.18,1200)}
  else{const n=ROCK[i%32];if(n){tone(F(n),t,.34,'sawtooth',.1);tone(F(n)*1.006,t,.34,'sawtooth',.06);tone(F(n+7),t,.34,'square',.05);tone(F(n+12),t,.3,'sawtooth',.04)}
    if(i%4===0)kick(t);if(i%4===2)noise(t,.12,.2,1500);noise(t,.03,.04,7000)}
}
function audio(){if(AC){AC.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(()=>{if(!mus||state==='select'||document.hidden)return;
    if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
    while(nextT<AC.currentTime+.15){beat(mstep++,nextT);nextT+=state==='bar'?.25:.259}},40)}
$('snd').addEventListener('click',()=>{mus=!mus;$('snd').setAttribute('aria-pressed',mus);$('snd').textContent=mus?'♪ Som ligado':'♪ Som desligado';if(mus)audio()});

CAST.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.id='pick-'+i;
  const k=document.createElement('canvas');k.width=132;k.height=204;const kg=k.getContext('2d');kg.scale(6,6);drawChar(kg,c,6,33,-1,null);
  b.append(k,c.n);b.addEventListener('click',()=>pick(i));$('pick').append(b)});

function fit(){const s=Math.max(2,Math.ceil(cv.clientWidth*(devicePixelRatio||1)/W));cv.width=W*s;cv.height=H*s;g.setTransform(s,0,0,s,0,0)}
addEventListener('resize',fit);
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();fit();requestAnimationFrame(loop);
</script>
