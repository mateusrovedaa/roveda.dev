image: node:22

stages:
  - build
  - deploy

variables:
  PNPM_VERSION: "10"

before_script:
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm install --frozen-lockfile

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install -g wrangler
  script:
    - wrangler pages deploy dist/ --project-name=roveeb-site --branch=main
  environment:
    name: production
    url: https://roveeb.com
  only:
    - main
